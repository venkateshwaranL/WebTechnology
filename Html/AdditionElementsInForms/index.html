<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Other form Elements</title>
  </head>
  <body>
    <header>
      <h1>Other Form Elements</h1>
    </header>
    <main>
      <form>
        <!-- color -->
        <label for="colour">Color</label>
        <input type="color" name="colour" id="colour" />
        <br />
        <br />
        <!-- date -->
        <label for="date">DOB</label>
        <input type="date" name="date" id="date" />
        <br />
        <br />
        <!-- range -->
        <label for="range">Range</label>
        <input
          type="range"
          name="range"
          id="range"
          min="0"
          max="50"
          step="10"
        />
      </form>
    </main>
  </body>
</html>
