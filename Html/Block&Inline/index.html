<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block & Inline</title>
    <style>
      p {
        color: red;
        background-color: black;
        margin: 2px;
      }
      a {
        color: red;
        background-color: black;
        margin: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Intro to Block and Inline</h1>
    <!-- Block level -->
    <p>Lorem ipsum dolor sit amet.</p>
    <p>Lorem ipsum dolor sit amet.</p>
    <!-- Inline Level -->
    <a href="#">Line 1</a>
    <a href="#">Line 2</a>
  </body>
</html>
