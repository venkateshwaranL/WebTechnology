<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radio & Check Box</title>
  </head>
  <body>
    <header>
      <h1>Radio & Check Box</h1>
    </header>
    <main>
      <form>
        <!-- checkBox -->
        <!-- <label for="Masala Dosa">erbawe</label> -->
        <input type="checkbox" name="dishes" id="Masala Dosa" checked />
        <label for="Masala Dosa">Masala Dosa</label>
        <input type="checkbox" name="dishes" id="Plain Dosa" />
        <label for="Plain Dosa">Plain Dosa</label>
        <input type="checkbox" name="dishes" id="Normal Dosa" />
        <label for="Normal Dosa">Normal Dosa</label>
      </form>
      <!-- radio-button -->
      <h2>Course</h2>
      <form>
        <label for="small">
          <input type="radio" name="size" id="small" />Small
        </label>
        <label for="medium">
          <input type="radio" name="size" id="medium" />Medium
        </label>
        <label for="large">
          <input type="radio" name="size" id="large" />Large
        </label>
        <!-- My point of view  -->
        <!-- <input type="radio" name="course" id="java" />
        <label for="java">Java</label>
        <input type="radio" name="course" id="c++" />
        <label for="c++">C++</label>
        <input type="radio" name="course" id="python" />
        <label for="python">Python</label> -->
      </form>
    </main>
  </body>
</html>
